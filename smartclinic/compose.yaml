services:
  mongodb:
    profiles:
      - 'dev'
    image: 'mongo:latest'
    environment:
      - 'MONGO_INITDB_DATABASE=prescriptions'
      - 'MONGO_INITDB_ROOT_PASSWORD=secret'
      - 'MONGO_INITDB_ROOT_USERNAME=admin'
    ports:
      - '27017:27017'
  mysql:
    profiles:
      - 'dev'
    image: 'mysql:latest'
    environment:
      - 'MYSQL_DATABASE=cms'
      - 'MYSQL_PASSWORD=secret'
      - 'MYSQL_ROOT_PASSWORD=verysecret'
      - 'MYSQL_USER=admin'
    ports:
      - '3306:3306'
