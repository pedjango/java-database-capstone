<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Admin Dashboard</title>

        <link rel="icon" type="image/png" th:href="@{/assets/images/logo/favicon.ico}" />
        <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}" />
        <link rel="stylesheet" th:href="@{/assets/css/header.css}" />
        <link rel="stylesheet" th:href="@{/assets/css/footer.css}" />

        <script th:src="@{/js/components/header.js}" defer></script>
        <script th:src="@{/js/components/footer.js}" defer></script>
        <script th:src="@{/js/components/doctorCard.js}" defer th:type="module"></script>
        <script th:src="@{/js/adminDashboard.js}" defer th:type="module"></script>
    </head>

    <body>
        <div class="container">
            <div class="wrapper">
                <div id="header"></div>

                <main class="main-content">
                    <section class="dashboard-controls">
                        <div class="search-section">
                            <input type="text" id="searchBar" class="input-field" placeholder="Search by doctor name" />
                        </div>

                        <div class="filter-section">
                            <select id="filterTime" class="select-dropdown">
                                <option value="">All Time Slots</option>
                                <option value="AM">Morning (AM)</option>
                                <option value="PM">Afternoon (PM)</option>
                            </select>

                            <select id="filterSpecialty" class="select-dropdown">
                                <option value="">All Specialties</option>
                                <option value="Cardiologist">Cardiologist</option>
                                <option value="Dermatologist">Dermatologist</option>
                                <option value="Neurologist">Neurologist</option>
                                <option value="Orthopedist">Orthopedist</option>
                                <option value="Pediatrician">Pediatrician</option>
                                <option value="Gynecologist">Gynecologist</option>
                                <option value="Psychiatrist">Psychiatrist</option>
                                <option value="Dentist">Dentist</option>
                                <option value="Ophthalmologist">Ophthalmologist</option>
                                <option value="ENT">ENT Specialist</option>
                                <option value="Urologist">Urologist</option>
                                <option value="Oncologist">Oncologist</option>
                                <option value="Gastroenterologist">Gastroenterologist</option>
                                <option value="General Physician">General Physician</option>
                            </select>

                            <button id="addDocBtn" class="adminBtn">Add Doctor</button>
                        </div>
                    </section>

                    <section class="dashboard-content">
                        <div id="content"></div>
                    </section>
                </main>

                <div id="footer"></div>
            </div>
        </div>

        <div id="modal" class="modal">
            <div class="modal-content">
                <span id="closeModal" class="close">&times;</span>
                <div id="modal-body"></div>
            </div>
        </div>
    </body>
</html>
