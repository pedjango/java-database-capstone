<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Admin Dashboard</title>

        <link rel="icon" type="image/png" th:href="@{/assets/images/favicon.png}" />
        <link rel="stylesheet" th:href="@{/assets/css/adminDashboard.css}" />
        <link rel="stylesheet" th:href="@{/assets/css/style.css}" />

        <script th:src="@{/js/render.js}" defer></script>
        <script th:src="@{/js/util.js}" defer></script>
        <script th:src="@{/js/components/header.js}" defer></script>
        <script th:src="@{/js/components/footer.js}" defer></script>
    </head>

    <body>
        <div class="container">
            <div class="wrapper">
                <div id="header"></div>

                <main class="main-content">
                    <section class="dashboard-controls">
                        <div class="search-section">
                            <input type="text" id="searchBar" class="input-field" placeholder="Search by doctor name" />
                        </div>

                        <div class="filter-section">
                            <select id="filterTime" class="select-dropdown">
                                <option value="">Sort by Time</option>
                                <option value="morning">Morning</option>
                                <option value="afternoon">Afternoon</option>
                                <option value="evening">Evening</option>
                            </select>

                            <select id="filterSpecialty" class="select-dropdown">
                                <option value="">Filter by Specialty</option>
                                <option value="cardiology">Cardiology</option>
                                <option value="neurology">Neurology</option>
                                <option value="dermatology">Dermatology</option>
                                <option value="general">General Medicine</option>
                            </select>
                        </div>
                    </section>

                    <section class="dashboard-content">
                        <div id="content"></div>
                    </section>
                </main>

                <div id="footer"></div>
            </div>
        </div>

        <div id="modal" class="modal">
            <div class="modal-content">
                <span id="closeModal" class="close">&times;</span>
                <div id="modal-body"></div>
            </div>
        </div>

        <script type="module" src="../../static/js/adminDashboard.js" defer></script>
        <script type="module" src="../../static/js/components/doctorCard.js" defer></script>
    </body>
</html>
