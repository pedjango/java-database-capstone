<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Doctor Listings</title>

        <link rel="icon" href="../assets/images/favicon.ico" />
        <link rel="stylesheet" href="../assets/css/adminDashboard.css" />
        <link rel="stylesheet" href="../assets/css/patientDashboard.css" />
        <link rel="stylesheet" href="../assets/css/header.css" />
        <link rel="stylesheet" href="../assets/css/footer.css" />

        <script src="../js/components/header.js" defer></script>
        <script src="../js/components/footer.js" defer></script>
        <script src="../js/components/doctorCard.js" defer type="module"></script>
        <script src="../js/doctorListings.js" defer type="module"></script>
        <script type="module" src="../js/components/modals.js"></script>
    </head>
    <body>
        <div class="container">
            <div class="wrapper">
                <div id="header"></div>

                <main class="main-content">
                    <section class="dashboard-controls">
                        <div class="filter-section">
                            <input type="text" id="searchBar" style="width: 100%" class="input-field" placeholder="Search by doctor name" />

                            <select id="filterTime" class="select-dropdown">
                                <option value="">All Time Slots</option>
                                <option value="AM">Morning (AM)</option>
                                <option value="PM">Afternoon (PM)</option>
                            </select>

                            <select id="filterSpecialty" class="select-dropdown">
                                <option value="">All Specialties</option>
                                <option value="Cardiologist">Cardiologist</option>
                                <option value="Dermatologist">Dermatologist</option>
                                <option value="Neurologist">Neurologist</option>
                                <option value="Orthopedist">Orthopedist</option>
                                <option value="Pediatrician">Pediatrician</option>
                                <option value="Gynecologist">Gynecologist</option>
                                <option value="Psychiatrist">Psychiatrist</option>
                                <option value="Dentist">Dentist</option>
                                <option value="Ophthalmologist">Ophthalmologist</option>
                                <option value="ENT">ENT Specialist</option>
                                <option value="Urologist">Urologist</option>
                                <option value="Oncologist">Oncologist</option>
                                <option value="Gastroenterologist">Gastroenterologist</option>
                                <option value="General Physician">General Physician</option>
                            </select>
                        </div>
                    </section>

                    <section class="dashboard-content">
                        <div id="content"></div>
                    </section>
                </main>

                <div id="footer"></div>
            </div>
        </div>
    </body>
</html>
