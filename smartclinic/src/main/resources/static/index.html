<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Smart Clinic Management System</title>

        <link rel="icon" type="image/png" href="./assets/images/favicon.png" />
        <link rel="stylesheet" href="./assets/css/index.css" />
        <link rel="stylesheet" href="./assets/css/style.css" />

        <script src="./js/util.js" defer></script>
        <script src="./js/render.js" defer></script>
        <script src="./js/components/header.js" defer></script>
        <script src="./js/components/footer.js" defer></script>
    </head>

    <body>
        <div class="container">
            <div class="wrapper">
                <div id="header"></div>

                <main class="main-content">
                    <section class="hero-section">
                        <div class="hero-content">
                            <h1 class="main-title">
                                Smart Clinic Management System
                            </h1>

                            <p class="main-description">
                                Securely manage appointments, prescriptions, doctors,
                                and patient records through role-based dashboards.
                            </p>

                            <div class="role-selection">
                                <h2 id="roleHeading">
                                    Select Your Role
                                </h2>

                                <div class="role-buttons">
                                    <button id="adminBtn" class="dashboard-btn" onclick="selectRole('ADMIN')">
                                        Admin
                                    </button>

                                    <button id="doctorBtn" class="dashboard-btn" onclick="selectRole('DOCTOR')">
                                        Doctor
                                    </button>
                                    <button id="patientBtn" class="dashboard-btn" onclick="selectRole('PATIENT')">
                                        Patient
                                    </button>
                                </div>
                            </div>
                        </div>
                    </section>
                </main>

                <div id="footer"></div>
            </div>
        </div>

        <div id="modal" class="modal">
            <div class="modal-content">
                <span id="closeModal" class="close">&times;</span>
                <div id="modal-body"></div>
            </div>
        </div>

        <script type="module" src="./js/services/index.js" defer>
        </script>
    </body>
</html>
